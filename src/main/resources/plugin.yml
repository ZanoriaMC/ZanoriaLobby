name: ZanoriaLobby
version: '1.0-SNAPSHOT'
main: net.zanoria.lobby.ZanoriaLobby
api-version: '1.21'
softdepend:
  - Nexus

commands:
  lobbynpc:
    description: Verwaltet Lobby Queue NPCs
    usage: /lobbynpc <set|list|reload>
    permission: zanoria.lobby.npc
    permission-message: Du hast keine Berechtigung.
  builder:
    description: Betritt den Builder-Server
    usage: /builder
    permission: zanoria.builder
    permission-message: Du hast keine Berechtigung fuer den Builder-Server.

permissions:
  zanoria.lobby.npc:
    description: Erlaubt das Verwalten von Lobby NPCs
    default: op
  zanoria.admin:
    description: Erlaubt Admin-Befehle
    default: op
  # Vergeben von Nexus (RankPresentationService.darfBauen) an OWNER, CO_OWNER, ADMIN.
  # Die Begruendung und ihre Ablaufbedingung stehen in NexusPermissions.BUILDER.
  zanoria.builder:
    description: Erlaubt den Zutritt zum Builder-Server (dort werden Welten angelegt und geloescht)
    default: op
