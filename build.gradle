plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'net.zanoria'
version = '1.0-SNAPSHOT'

repositories {
    // ⚠️ mavenLocal fuer net.zanoria:zanlang:1.0 - siehe settings.gradle.
    // ZanLang laesst sich hier nicht als includeBuild einbinden (paperweight).
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

def ideaProjectsRoot = providers.environmentVariable("IDEA_PROJECTS_DIR")
        .orElse(System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
                ? "C:/Users/krinc/IdeaProjects"
                : "/mnt/c/Users/krinc/IdeaProjects")
        .get()

def firstExistingFile(List<String> candidates) {
    def match = candidates.collect { file(it) }.find { it.exists() }
    return match != null ? match : file(candidates.first())
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly(files(firstExistingFile([
            "${ideaProjectsRoot}/Nexus/build/libs/Nexus-1.0-SNAPSHOT.jar",
            "/home/corwis/zanoria/apps/Nexus.jar"
    ])))
    // ⚠️ Ueber die KOORDINATE, nicht ueber einen Dateipfad. Hier stand eine
    // firstExistingFile-Kette auf "Corox Lang-1.0.jar" mit zwei Rueckfaellen.
    // Zwei Schaeden daran, beide am 2026-08-15 belegt:
    //   1. Der Dateiname traegt ein LEERZEICHEN (alter rootProject.name 'Corox Lang').
    //      Genau daran hat der Deploy-Waechter ZanLang abgelehnt.
    //   2. Die Rueckfallkette maskiert den Bruch: faellt Position 1 weg, greift
    //      STILLSCHWEIGEND RelicWars/run/plugins/ZanLang-1.0.jar - ein beliebig altes
    //      Jar. Ein Rueckfall, der gelingt und dabei das Falsche liefert, ist genau
    //      die Form, die diesem Projekt heute drei Matches gekostet hat.
    // Die Koordinate ist rename-fest: artifactId steht in ZanLang/build.gradle:85
    // explizit auf 'zanlang' und haengt nicht an rootProject.name.
    compileOnly "net.zanoria:zanlang:1.0"
    implementation 'redis.clients:jedis:5.1.3'
}

shadowJar {
    relocate 'redis.clients', 'net.zanoria.lobby.libs.jedis'
    relocate 'org.apache.commons.pool2', 'net.zanoria.lobby.libs.pool2'
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('plain')
}

build {
    dependsOn shadowJar
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  Befehlswaechter — eingebunden am 2026-08-21
//
//  Faengt Befehle, die deklariert oder implementiert sind und die niemand anmeldet. Wogegen er
//  im Einzelnen steht und warum das Skript in zanoria-common liegt statt hier, steht in seinem
//  Kopfkommentar: ../zanoria-common/gradle/befehlswaechter.gradle
//
//  ⚠️ Dieses Repo fuehrt eine plugin.yml, kein paper-plugin.yml. Damit greift hier vor allem
//  Probe C: ein getCommand("x") auf einen Namen, der nicht unter commands: steht, gibt null
//  zurueck - und das .setExecutor(...) darauf ist eine NullPointerException im onEnable, die
//  das ganze Plugin deaktiviert.
//
//  ⚠️ SEINE REICHWEITE IST DAS DESKRIPTOR-MODUL, nicht "das Repo". Der Bau uebergibt zwar
//  project.rootDir, aber das Skript benutzt den Pfad nur zum FINDEN der Deskriptoren; die
//  gepruefte QUELLENMENGE sammelt `module_finden()` in
//  ../zanoria-common/tools/befehlswaechter.py allein unter dem Verzeichnis, in dem die
//  plugin.yml liegt. Hier faellt beides zusammen - der Deskriptor liegt in src/main/resources
//  der Repowurzel. Gemessen am 2026-08-22: 5 Java-Dateien im Repo, und der Waechter meldet
//  woertlich "geprueft 1 Plugin-Deskriptor(en), 5 Java-Datei(en)". Deckung vollstaendig.
//  ⚠️ Das haelt nur, solange dieses Repo EIN Modul bleibt. Wer ein Nachbarmodul ohne eigenen
//  Deskriptor anlegt, macht dessen Befehlscode fuer den Waechter unsichtbar, ohne dass etwas
//  rot wird - in NexusStrike bleiben so 47 von 101 Dateien ungesehen. Der Beleg, beide
//  Richtungen: dieselbe Klasse meldet im Deskriptor-Modul E_BEFEHL_NIE_ERZEUGT und im
//  Nachbarmodul "keine Funde", Rueckgabe 0.
//
//  ⚠️ Die if/throw-Kombination ist keine Umstaendlichkeit. Ein blosses
//  `if (waechter.isFile()) apply from: waechter` verschwindet lautlos, sobald jemand die Datei
//  umbenennt oder verschiebt - ein Waechter, der bei einem Tippfehler still aussetzt, ist kein
//  Waechter. Fehlt dagegen der ganze Geschwister-Checkout, ist das etwas anderes und darf
//  durchgehen: dann baut jemand bewusst ohne den Stack.
//
//  ⚠️ Er haengt an `check`, nicht an `build`, und braucht Python 3 auf dem Bauwirt. Fehlt der
//  Interpreter, BRICHT der Task ab - er faellt ausdruecklich NICHT auf gruen zurueck.
// ═══════════════════════════════════════════════════════════════════════════════════════════
def waechter = file("${rootDir}/../zanoria-common/gradle/befehlswaechter.gradle")
if (file("${rootDir}/../zanoria-common").isDirectory()) {
    if (!waechter.isFile()) {
        throw new GradleException(
                "zanoria-common ist da, aber ${waechter} fehlt - der Befehlswaechter waere" +
                " stillschweigend weg. Das ist genau die Bauart Fehler, gegen die er steht.")
    }
    apply from: waechter
}
