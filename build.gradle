plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'net.zanoria'
version = '1.0-SNAPSHOT'

repositories {
    // ⚠️ mavenLocal fuer net.zanoria:zanlang:1.0 - siehe settings.gradle.
    // ZanLang laesst sich hier nicht als includeBuild einbinden (paperweight).
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

def ideaProjectsRoot = providers.environmentVariable("IDEA_PROJECTS_DIR")
        .orElse(System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
                ? "C:/Users/krinc/IdeaProjects"
                : "/mnt/c/Users/krinc/IdeaProjects")
        .get()

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")

    // ⚠️ Ueber die KOORDINATE, nicht ueber einen Dateipfad — dieselbe Entscheidung, die
    // ZanLang eine Zeile tiefer schon traegt, und aus demselben Grund.
    //
    // Hier stand eine firstExistingFile-Kette mit zwei Kandidaten:
    //     ${ideaProjectsRoot}/Nexus/build/libs/Nexus-1.0-SNAPSHOT.jar
    //     /home/corwis/zanoria/apps/Nexus.jar          <- das AUSGELIEFERTE Jar
    // und einem Rueckfall auf candidates.first(), also auf einen Pfad, der nicht existiert.
    // Drei Schaeden daran:
    //   1. Faellt Position 1 weg, greift STILLSCHWEIGEND das ausgelieferte Jar aus dem
    //      Betriebsordner. Das ist beliebig alt, und der Bau wird gruen.
    //   2. Existiert keiner der beiden, liefert firstExistingFile einen NICHT existierenden
    //      Pfad. files(...) auf eine fehlende Datei traegt einfach nichts bei - der Bau
    //      uebersetzt dann OHNE Nexus-API und meldet "package net.zanoria.nexus does not
    //      exist", ohne zu sagen, dass ein Jar fehlt.
    //   3. Der Pfad haengt an ideaProjectsRoot, also an C:/Users/krinc/IdeaProjects bzw.
    //      /mnt/c/... - nach einem Umzug zeigen BEIDE Zweige ins Leere.
    //
    // Die Koordinate ist rename-fest: Nexus/build.gradle:436 setzt artifactId = 'nexus-core'.
    // Nachgemessen am 2026-09-12: nexus-core-1.0-SNAPSHOT.jar liegt in mavenLocal und traegt
    // alle vier Typen, die dieses Repo benutzt (NexusPlugin, queue.QueueEntry,
    // queue.QueueService, queue.QueueType).
    //
    // ⚠️ Die Gefahr "veraltetes Jar uebersetzt gruen" bleibt — sie ist nur nicht mehr
    // versteckt. Der Waechter unter dependencies macht sie sichtbar, statt sie zu heilen;
    // heilen koennte sie nur ein includeBuild, und das scheitert hier an paperweight
    // (siehe settings.gradle, am 2026-08-15 fuer ZanLang gemessen).
    compileOnly "net.zanoria:nexus-core:1.0-SNAPSHOT"
    // ⚠️ Ueber die KOORDINATE, nicht ueber einen Dateipfad. Hier stand eine
    // firstExistingFile-Kette auf "Corox Lang-1.0.jar" mit zwei Rueckfaellen.
    // Zwei Schaeden daran, beide am 2026-08-15 belegt:
    //   1. Der Dateiname traegt ein LEERZEICHEN (alter rootProject.name 'Corox Lang').
    //      Genau daran hat der Deploy-Waechter ZanLang abgelehnt.
    //   2. Die Rueckfallkette maskiert den Bruch: faellt Position 1 weg, greift
    //      STILLSCHWEIGEND RelicWars/run/plugins/ZanLang-1.0.jar - ein beliebig altes
    //      Jar. Ein Rueckfall, der gelingt und dabei das Falsche liefert, ist genau
    //      die Form, die diesem Projekt heute drei Matches gekostet hat.
    // Die Koordinate ist rename-fest: artifactId steht in ZanLang/build.gradle:85
    // explizit auf 'zanlang' und haengt nicht an rootProject.name.
    compileOnly "net.zanoria:zanlang:1.0"
    implementation 'redis.clients:jedis:5.1.3'

    // ⚠️ paper-api ist oben compileOnly. Die Tests brauchen es auf ihrem EIGENEN Pfad -
    // compileOnly vererbt sich nicht an testCompileClasspath.
    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * ⚠️ LAUTER ABBRUCH STATT STILLER ABWESENHEIT — und warum als VORGESCHALTETE Aufgabe.
 *
 * Erster Versuch war ein {@code doFirst} auf {@code compileJava}, das
 * {@code configurations.compileClasspath} befragt. Gemessen am 2026-09-12: der Zweig ist
 * TOTER CODE. Bei einer unaufloesbaren Koordinate wirft Gradle schon beim Aufloesen des
 * Klassenpfads, bevor {@code doFirst} laeuft:
 *
 *     Could not resolve all files for configuration ':compileClasspath'.
 *       > Could not find net.zanoria:nexus-core:...
 *
 * Das ist selbst ein lauter Abbruch und nennt sogar den durchsuchten mavenLocal-Pfad — aber
 * nicht die Abhilfe. Deshalb steht die Pruefung jetzt in einer Aufgabe, von der
 * {@code compileJava} abhaengt: Aufgabenabhaengigkeiten laufen VOR der abhaengigen Aufgabe,
 * also vor dem Aufloesen.
 *
 * ⚠️ Geprueft wird die DATEI in mavenLocal, nicht die Konfiguration — genau darum geht es.
 */
tasks.register('pruefeNexusArtefakt') {
    description = 'Bricht laut ab, wenn nexus-core fehlt, und warnt laut, wenn es veraltet ist.'
    doLast {
        def jar = file("${System.getProperty('user.home')}/.m2/repository/net/zanoria/nexus-core/1.0-SNAPSHOT/nexus-core-1.0-SNAPSHOT.jar")
        if (!jar.exists()) {
            throw new GradleException("""
                |⚠️ nexus-core fehlt in mavenLocal:
                |     ${jar}
                |
                |   Zu tun, im Nachbarcheckout Nexus:
                |       ./gradlew publishToMavenLocal
                |
                |   ⚠️ Warum das ein Abbruch ist und keine Warnung: bis zum 2026-09-12 stand
                |   hier eine firstExistingFile-Kette. Fiel ihr erster Kandidat weg, griff
                |   STILLSCHWEIGEND /home/corwis/zanoria/apps/Nexus.jar - das AUSGELIEFERTE
                |   Jar, beliebig alt, Bau gruen. Fehlten beide, trug files(...) einfach
                |   nichts bei und der Compiler meldete "package net.zanoria.nexus does not
                |   exist" - eine Meldung, die nach einem Tippfehler im Import aussieht.
                """.stripMargin().trim())
        }

        // ── Alterspruefung. Nur wenn der Nachbarcheckout da ist; fehlt er, entfaellt der
        //    Hinweis, statt falsch zu sein.
        def quellen = file("${ideaProjectsRoot}/Nexus/src/main/java")
        if (!quellen.isDirectory()) {
            return
        }
        def neueste = 0L
        quellen.eachFileRecurse { f ->
            if (f.name.endsWith('.java') && f.lastModified() > neueste) {
                neueste = f.lastModified()
            }
        }
        if (neueste <= jar.lastModified()) {
            return
        }
        def tage = ((neueste - jar.lastModified()) / 86400000L) as long
        logger.warn("""
            |⚠️⚠️ nexus-core in mavenLocal ist AELTER als die Nexus-Quellen.
            |     Jar:     ${new Date(jar.lastModified())}
            |     Quelle:  ${new Date(neueste)}   (${tage} Tag(e) neuer)
            |
            |     Dieser Bau wird GRUEN und traegt eine veraltete API; der Fehler zeigt sich
            |     erst zur Laufzeit. Belegt am 2026-09-12: das Jar trug
            |     DatabaseManager\$PoolStand - den Namen VOR dem Umbau vom selben Tag.
            |
            |     Im Nexus-Checkout:  ./gradlew publishToMavenLocal
            |
            |     ⚠️ Kein Abbruch: er traefe jeden Bau, dem nicht gerade ein
            |     publishToMavenLocal vorausging - also fast jeden -, und ein Waechter, der
            |     immer ausschlaegt, wird abgeschaltet statt gelesen.
            """.stripMargin())
    }
}

tasks.named('compileJava') { dependsOn 'pruefeNexusArtefakt' }

shadowJar {
    relocate 'redis.clients', 'net.zanoria.lobby.libs.jedis'
    relocate 'org.apache.commons.pool2', 'net.zanoria.lobby.libs.pool2'
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('plain')
}

build {
    dependsOn shadowJar
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  KISTENWAECHTER — eingebunden am 2026-09-03
//
//  Er haelt die TRAGENDE AUFLAGE des Auftrags: die Menues muessen spaeter gegen ZanUI
//  austauschbar sein, OHNE die Hoerer anzufassen. Corwis woertlich: "Sonst ist 'experimentell'
//  nur ein Wort, und in drei Monaten steht es noch da."
//
//  ⚠️ WARUM DAS OHNE WAECHTER NICHT HAELT. ZanUI kennt keine Slots - es fuehrt die
//  Paper-Dialog-API (UiScreen = Kennung + Titel + Knoepfe), am 2026-09-03 an
//  ZanUI/core/.../UiScreen.java gemessen. Ein Inventory-Typ in einem Hoerer uebersetzt
//  einwandfrei, macht NICHTS rot - und macht den Tausch trotzdem unmoeglich. Genau die Sorte
//  Bruch, die kein Test findet, weil niemand nach ihr fragt.
//
//  ⚠️ ItemStack steht ABSICHTLICH NICHT auf der Liste, und das ist eine Entscheidung, keine
//  Luecke. Die Auflage betrifft MENUES, nicht Gegenstaende: die Hotbar-Items bleiben auch nach
//  dem Tausch ItemStacks - ZanUI ersetzt die Menues, nicht das Inventar des Spielers. Ein Verbot
//  von ItemStack wuerde Stueck 2 unbaubar machen und haette mit der Austauschbarkeit nichts zu
//  tun.
//
//  ⚠️ ER LIEST DEN BYTECODE, NICHT DEN QUELLTEXT. Eine Quelltextsuche hat in diesem Stack schon
//  einmal einen Kommentar fuer eine Anmeldung gehalten. Im Konstantenpool steht der Typ so oder
//  so - ob er aus einem Import, einer Signatur oder einem Aufruf kommt.
//
//  ⚠️ ER MACHT DEN BAU ROT, anders als der Platzhalterwaechter daneben. Begruendung: ein
//  Kisten-Typ im Hoerer ist kein zu erledigender Rest, sondern der Bruch selbst. Und er waere
//  nicht DAUERHAFT rot, sondern nur bei einem echten Verstoss - die Ermuedungsgefahr eines immer
//  roten Baus (in ZanoriaCommands beobachtet) besteht hier also nicht.
//
//  ⚠️ ER PRUEFT ZUERST SEINE EIGENE SUCHE. Findet er im Umsetzungspaket KEINEN Kisten-Typ,
//  bricht er ab statt "keine Funde ausserhalb" zu melden. Ohne das waere er gratis gruen, sobald
//  jemand das Paket umbenennt oder die Typnamen sich aendern - ein Sucher, der nichts sieht,
//  meldet sonst ein geloestes Problem.
// ═══════════════════════════════════════════════════════════════════════════════════════════
def kistenwaechter = tasks.register('kistenwaechter') {
    dependsOn tasks.named('classes')
    def klassenVerzeichnis = layout.buildDirectory.dir('classes/java/main')
    inputs.dir(klassenVerzeichnis)
    outputs.upToDateWhen { false }

    doLast {
        def verboten = [
                'org/bukkit/inventory/Inventory',
                'org/bukkit/inventory/InventoryView',
                'org/bukkit/event/inventory/InventoryClickEvent',
                'org/bukkit/event/inventory/InventoryCloseEvent',
                'org/bukkit/event/inventory/InventoryDragEvent',
        ]
        def erlaubtesPaket = 'net/zanoria/lobby/menue/chest/'

        def wurzel = klassenVerzeichnis.get().asFile
        def klassen = []
        if (wurzel.isDirectory()) {
            wurzel.eachFileRecurse { if (it.name.endsWith('.class')) klassen << it }
        }
        if (klassen.isEmpty()) {
            throw new GradleException(
                    "KISTENWAECHTER: keine uebersetzten Klassen unter ${wurzel} - dann ist" +
                    " 'kein Kisten-Typ gefunden' kein Befund, sondern ein leerer Sucher.")
        }

        def treffer = [:]
        def imPaket = [:]
        klassen.each { datei ->
            def pfad = wurzel.toPath().relativize(datei.toPath()).toString().replace('\\', '/')
            // ⚠️ ISO-8859-1: die Klassendatei wird als BYTES gelesen, nicht als Text. Jedes Byte
            // bildet auf genau ein Zeichen ab, damit die Typnamen im Konstantenpool auffindbar
            // bleiben. UTF-8 wuerde Bytefolgen zusammenfassen und Treffer verschlucken.
            def text = new String(datei.getBytes(), 'ISO-8859-1')
            def gefunden = verboten.findAll { text.contains(it) }
            if (gefunden.isEmpty()) {
                return
            }
            if (pfad.startsWith(erlaubtesPaket)) {
                imPaket[pfad] = gefunden
            } else {
                treffer[pfad] = gefunden
            }
        }

        if (imPaket.isEmpty()) {
            throw new GradleException(
                    "KISTENWAECHTER: im Umsetzungspaket '${erlaubtesPaket}' steht KEIN einziger" +
                    " Kisten-Typ. Entweder ist die Umsetzung weg, oder diese Suche findet nichts" +
                    " mehr (Paket umbenannt? Typnamen geaendert?). In beiden Faellen ist die" +
                    " Meldung 'keine Funde ausserhalb' wertlos - deshalb bricht sie hier ab" +
                    " statt gruen zu melden.")
        }

        logger.lifecycle("KISTENWAECHTER: ${klassen.size()} Klasse(n) geprueft," +
                " ${imPaket.size()} im Umsetzungspaket (Positivkontrolle bestanden).")

        if (!treffer.isEmpty()) {
            treffer.each { pfad, typen ->
                logger.error("KISTENWAECHTER:   ${pfad} -> ${typen.join(', ')}")
            }
            throw new GradleException(
                    "KISTENWAECHTER: ${treffer.size()} Klasse(n) ausserhalb von" +
                    " '${erlaubtesPaket}' fassen einen Kisten-Typ an.\n" +
                    "SCHADEN: die Menues sind dann NICHT mehr gegen ZanUI austauschbar, ohne" +
                    " diese Klassen anzufassen. ZanUI kennt keine Slots - es fuehrt die" +
                    " Paper-Dialog-API (Kennung + Titel + Knoepfe). Wer ein Menue braucht, ruft" +
                    " Menue.oeffne(spieler, bildschirm) und nichts anderes.")
        }
    }
}
tasks.named('check') { dependsOn kistenwaechter }

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  PLATZHALTERWAECHTER — eingebunden am 2026-09-03
//
//  Er meldet bei jedem Bau, welche Hotbar-Eintraege noch auf Platzhalter zeigen - also fuer
//  welche die Textur fehlt.
//
//  ⚠️ ER MACHT DEN BAU NICHT ROT, und das ist der Unterschied zum Kistenwaechter darueber.
//  Er waere ab heute DAUERHAFT rot (alle fuenf sind Platzhalter), und ein dauerhaft roter Bau
//  wird nach zwei Tagen ignoriert - in ZanoriaCommands beobachtet. Er MELDET laut; die MENGE
//  ist in DieHotbarNenntIhrePlatzhalterTest gepinnt, und dort wird es rot, wenn einer lautlos
//  dazukommt ODER lautlos verschwindet. Laut melden und scharf pinnen sind zwei Aufgaben, und
//  sie liegen absichtlich an zwei Orten.
//
//  ⚠️ ER LIEST DAS UEBERSETZTE ENUM, nicht den Quelltext - er fragt istPlatzhalter() am
//  geladenen Wert. Eine Quelltextsuche haette in diesem Stack schon einmal einen Kommentar fuer
//  eine Anmeldung gehalten.
//
//  ⚠️ ER BRICHT AB, WENN DAS ENUM LEER IST. Ein leerer Sucher meldete sonst "0 von 0, keine
//  Platzhalter" - und das saehe aus wie ein geloestes Problem statt wie eine kaputte Messung.
// ═══════════════════════════════════════════════════════════════════════════════════════════
def platzhalterwaechter = tasks.register('platzhalterwaechter') {
    dependsOn tasks.named('classes')
    def klassenVerzeichnis = layout.buildDirectory.dir('classes/java/main')
    def pfade = configurations.compileClasspath
    inputs.dir(klassenVerzeichnis)
    outputs.upToDateWhen { false }

    doLast {
        def urls = ([klassenVerzeichnis.get().asFile] + pfade.files)
                .collect { it.toURI().toURL() } as URL[]
        def lader = new URLClassLoader(urls, (ClassLoader) null)
        def enumKlasse = lader.loadClass('net.zanoria.lobby.hotbar.Hotbarplatz')
        def alle = enumKlasse.getEnumConstants()

        if (alle.length == 0) {
            throw new GradleException(
                    "PLATZHALTERWAECHTER: Hotbarplatz hat KEINE Eintraege - 'kein Platzhalter'" +
                    " waere dann kein Befund, sondern ein leerer Sucher.")
        }

        def offen = alle.findAll { it.istPlatzhalter() }
        logger.lifecycle("PLATZHALTERWAECHTER: ${offen.size()} von ${alle.length}" +
                " Hotbar-Eintraegen zeigen noch auf Platzhalter.")
        if (offen.isEmpty()) {
            logger.lifecycle("PLATZHALTERWAECHTER: jede Textur ist geliefert.")
        } else {
            offen.each {
                logger.lifecycle("PLATZHALTERWAECHTER:   ${it.name()} (Platz ${it.platz()})" +
                        " -> ${it.sinnbild().nexoKennung()}" +
                        " (Rueckfall: ${it.sinnbild().vanillaRueckfall()})")
            }
            logger.lifecycle("PLATZHALTERWAECHTER: solange hier Zeilen stehen, sieht die Hotbar" +
                    " im Spiel nach Vanilla aus. Wer eine Textur liefert, setzt istPlatzhalter()" +
                    " auf false UND traegt den Eintrag in" +
                    " DieHotbarNenntIhrePlatzhalterTest aus - beides zusammen.")
        }
    }
}
tasks.named('check') { dependsOn platzhalterwaechter }

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  Befehlswaechter — eingebunden am 2026-08-21
//
//  Faengt Befehle, die deklariert oder implementiert sind und die niemand anmeldet. Wogegen er
//  im Einzelnen steht und warum das Skript in zanoria-common liegt statt hier, steht in seinem
//  Kopfkommentar: ../zanoria-common/gradle/befehlswaechter.gradle
//
//  ⚠️ Dieses Repo fuehrt eine plugin.yml, kein paper-plugin.yml. Damit greift hier vor allem
//  Probe C: ein getCommand("x") auf einen Namen, der nicht unter commands: steht, gibt null
//  zurueck - und das .setExecutor(...) darauf ist eine NullPointerException im onEnable, die
//  das ganze Plugin deaktiviert.
//
//  ⚠️ SEINE REICHWEITE IST DAS DESKRIPTOR-MODUL, nicht "das Repo". Der Bau uebergibt zwar
//  project.rootDir, aber das Skript benutzt den Pfad nur zum FINDEN der Deskriptoren; die
//  gepruefte QUELLENMENGE sammelt `module_finden()` in
//  ../zanoria-common/tools/befehlswaechter.py allein unter dem Verzeichnis, in dem die
//  plugin.yml liegt. Hier faellt beides zusammen - der Deskriptor liegt in src/main/resources
//  der Repowurzel. Gemessen am 2026-08-22: 5 Java-Dateien im Repo, und der Waechter meldet
//  woertlich "geprueft 1 Plugin-Deskriptor(en), 5 Java-Datei(en)". Deckung vollstaendig.
//  ⚠️ DIE ZAHL IST EINE MOMENTAUFNAHME UND WAECHST MIT JEDER DATEI - hier steht deshalb
//  KEINE aktuelle mehr. Wer eine feste Zahl gegen den Bestand haelt, misst das Datum und
//  nicht die Deckung.
//
//  ⚠️ Und das ist am Kommentar selbst vorgefuehrt worden: die erste Fassung dieses Absatzes
//  nannte am 2026-09-03 "6 Java-Datei(en)" als Beispiel - und war noch am selben Tag ueberholt
//  (23, nach Testgeruest, Schutz, Naht und Kistenumsetzung). Ein Absatz, der VOR veraltenden
//  Zahlen warnt und dabei selbst eine fuehrt, ist die Warnung in Reinform.
//
//  Die Aussage, die NICHT veraltet: gemeldete Zahl == Zahl der .java unter der Wurzel. Genau
//  die prueft der Waechter seit 2026-09-01 selbst und faellt sonst mit Rueckgabe 5. Wer den
//  aktuellen Stand wissen will, faehrt `./gradlew check` und liest die Zeile.
//
//  ⚠️ src/test LIEGT IN DER GEPRUEFTEN MENGE. Ein Testfall, der ein getCommand("x")-Muster
//  nachbaut, kann damit Probe C ausloesen, obwohl er nichts anmeldet. Heute kein Fehler,
//  aber die Falle liegt scharf - beim ersten Befehlstest hier nachsehen.
//  ⚠️ Das haelt nur, solange dieses Repo EIN Modul bleibt. Wer ein Nachbarmodul ohne eigenen
//  Deskriptor anlegt, macht dessen Befehlscode fuer den Waechter unsichtbar, ohne dass etwas
//  rot wird - in NexusStrike bleiben so 47 von 101 Dateien ungesehen. Der Beleg, beide
//  Richtungen: dieselbe Klasse meldet im Deskriptor-Modul E_BEFEHL_NIE_ERZEUGT und im
//  Nachbarmodul "keine Funde", Rueckgabe 0.
//
//  ⚠️ Die if/throw-Kombination ist keine Umstaendlichkeit. Ein blosses
//  `if (waechter.isFile()) apply from: waechter` verschwindet lautlos, sobald jemand die Datei
//  umbenennt oder verschiebt - ein Waechter, der bei einem Tippfehler still aussetzt, ist kein
//  Waechter. Fehlt dagegen der ganze Geschwister-Checkout, ist das etwas anderes und darf
//  durchgehen: dann baut jemand bewusst ohne den Stack.
//
//  ⚠️ Er haengt an `check`, nicht an `build`, und braucht Python 3 auf dem Bauwirt. Fehlt der
//  Interpreter, BRICHT der Task ab - er faellt ausdruecklich NICHT auf gruen zurueck.
// ═══════════════════════════════════════════════════════════════════════════════════════════
def waechter = file("${rootDir}/../zanoria-common/gradle/befehlswaechter.gradle")
if (file("${rootDir}/../zanoria-common").isDirectory()) {
    if (!waechter.isFile()) {
        throw new GradleException(
                "zanoria-common ist da, aber ${waechter} fehlt - der Befehlswaechter waere" +
                " stillschweigend weg. Das ist genau die Bauart Fehler, gegen die er steht.")
    }
    apply from: waechter
}
